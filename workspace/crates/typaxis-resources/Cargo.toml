[package]
name = "typaxis-resources"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
book-v2-staging = ["typaxis-display-list/book-v2-staging"]
staging-fixtures = ["typaxis-display-list/staging-fixtures"]

[dependencies]
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
png = "=0.18.1"
typaxis-core = { path = "../typaxis-core" }
typaxis-font = { path = "../typaxis-font" }
typaxis-display-list = { path = "../typaxis-display-list" }
typaxis-document = { path = "../typaxis-document" }
typaxis-resource-admission = { path = "../typaxis-resource-admission" }
typaxis-shaping = { path = "../typaxis-shaping" }

[dev-dependencies]
read-fonts = "=0.31.3"
typaxis-display-list = { path = "../typaxis-display-list", features = ["staging-fixtures"] }
typaxis-layout = { path = "../typaxis-layout" }
typaxis-pagination = { path = "../typaxis-pagination" }
typaxis-style = { path = "../typaxis-style" }
typaxis-text = { path = "../typaxis-text" }
typaxis-syntax = { path = "../typaxis-syntax" }
