[package]
name = "typaxis-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
book-v2-staging = ["typaxis-machine-input/book-v2-staging", "typaxis-document-package/book-v2-staging", "typaxis-document/book-v2-staging", "typaxis-style/book-v2-staging"]
staging-fixtures = ["typaxis-document-package/staging-fixtures"]

[dependencies]
typaxis-core = { path = "../typaxis-core" }
typaxis-diagnostics = { path = "../typaxis-diagnostics" }
typaxis-document-package = { path = "../typaxis-document-package" }
typaxis-machine-input = { path = "../typaxis-machine-input" }
typaxis-math = { path = "../typaxis-math" }
typaxis-text = { path = "../typaxis-text" }
typaxis-document = { path = "../typaxis-document" }
typaxis-style = { path = "../typaxis-style" }

[dev-dependencies]
serde_json = "=1.0.151"
typaxis-document-package = { path = "../typaxis-document-package", features = ["staging-fixtures"] }
