[package]
name = "typaxis-manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Keep legacy source walkers exhaustive when the private successor domain is enabled.
# This does not issue a successor manifest or publish a profile.
book-v2-staging = ["typaxis-document/book-v2-staging", "typaxis-pdf/book-v2-staging", "typaxis-syntax/book-v2-staging", "typaxis-layout/book-v2-staging", "typaxis-machine-profile/book-v2-staging"]
staging-fixtures = [
  "typaxis-display-list/staging-fixtures",
  "typaxis-pdf/staging-fixtures",
  "typaxis-resources/staging-fixtures",
]

[dependencies]
typaxis-core = { path = "../typaxis-core" }
typaxis-display-list = { path = "../typaxis-display-list" }
typaxis-document = { path = "../typaxis-document" }
typaxis-host-admission = { path = "../typaxis-host-admission" }
typaxis-layout = { path = "../typaxis-layout" }
typaxis-layout-contract = { path = "../typaxis-layout-contract" }
typaxis-machine-input = { path = "../typaxis-machine-input" }
typaxis-machine-profile = { path = "../typaxis-machine-profile" }
typaxis-math = { path = "../typaxis-math" }
typaxis-pagination = { path = "../typaxis-pagination" }
typaxis-pdf = { path = "../typaxis-pdf" }
typaxis-resource-admission = { path = "../typaxis-resource-admission" }
typaxis-resources = { path = "../typaxis-resources" }
typaxis-syntax = { path = "../typaxis-syntax" }
typaxis-text = { path = "../typaxis-text" }

[dev-dependencies]
typaxis-display-list = { path = "../typaxis-display-list", features = ["staging-fixtures"] }
typaxis-diagnostics = { path = "../typaxis-diagnostics" }
typaxis-resources = { path = "../typaxis-resources", features = ["staging-fixtures"] }
typaxis-style = { path = "../typaxis-style" }
