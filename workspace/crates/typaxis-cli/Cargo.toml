[package]
name = "typaxis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "typaxis"
path = "src/main.rs"

[dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }
typaxis-core = { path = "../typaxis-core" }
typaxis-diagnostics = { path = "../typaxis-diagnostics" }
typaxis-document = { path = "../typaxis-document" }
typaxis-document-package = { path = "../typaxis-document-package" }
typaxis-machine-input = { path = "../typaxis-machine-input" }
typaxis-machine-profile = { path = "../typaxis-machine-profile" }
typaxis-syntax = { path = "../typaxis-syntax" }
typaxis-text = { path = "../typaxis-text" }
typaxis-shaping = { path = "../typaxis-shaping" }
typaxis-linebreak = { path = "../typaxis-linebreak" }
typaxis-layout = { path = "../typaxis-layout" }
typaxis-pagination = { path = "../typaxis-pagination" }
typaxis-display-list = { path = "../typaxis-display-list" }
typaxis-resources = { path = "../typaxis-resources" }
typaxis-pdf = { path = "../typaxis-pdf" }
typaxis-manifest = { path = "../typaxis-manifest" }

[dev-dependencies]
typaxis-testkit = { path = "../typaxis-testkit", features = ["precomposed-vector-fixtures"] }
