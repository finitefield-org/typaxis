[package]
name = "typaxis-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
staging-fixtures = [
  "typaxis-display-list/staging-fixtures",
  "typaxis-resources/staging-fixtures",
]

[dependencies]
typaxis-core = { path = "../typaxis-core" }
typaxis-display-list = { path = "../typaxis-display-list" }
typaxis-font = { path = "../typaxis-font" }
typaxis-math = { path = "../typaxis-math" }
typaxis-resource-admission = { path = "../typaxis-resource-admission" }
typaxis-resources = { path = "../typaxis-resources" }
typaxis-shaping = { path = "../typaxis-shaping" }
typaxis-syntax = { path = "../typaxis-syntax" }

[dev-dependencies]
typaxis-display-list = { path = "../typaxis-display-list", features = ["staging-fixtures"] }
typaxis-resources = { path = "../typaxis-resources", features = ["staging-fixtures"] }
