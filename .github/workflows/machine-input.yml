name: Machine input PDF

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-evidence:
    name: ${{ matrix.host }} machine evidence
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            os: ubuntu-latest
          - host: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Select one current Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc -Vv
          cargo -V
      - name: Install Python validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Install Linux PDF tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes mupdf-tools poppler-utils
      - name: Install macOS PDF tools
        if: runner.os == 'macOS'
        run: brew install mupdf poppler
      - name: Locked format and static gates
        run: |
          cargo fmt --manifest-path workspace/Cargo.toml --all -- --check
          cargo check --manifest-path workspace/Cargo.toml --workspace --all-targets --locked
          cargo clippy --manifest-path workspace/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Locked workspace and Schema gates
        run: |
          cargo test --manifest-path workspace/Cargo.toml --workspace --all-targets --locked
          python schemas/validate.py
          python -m unittest discover -s tools -p "test_*.py"
      - name: Public machine profile gate
        run: >-
          python tools/verify_machine_profile.py
          --repository .
          --fixture samples/machine-package/profiles/paragraph-1/combined/expected.json
          --runs 2
          --require-external-tools
      - uses: actions/upload-artifact@v7
        with:
          name: machine-evidence-${{ matrix.host }}
          path: target/machine-e2e/host-evidence/*.json
          if-no-files-found: error

  aggregate-evidence:
    name: Aggregate machine host evidence
    needs: host-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "jsonschema>=4.18,<5"
      - uses: actions/download-artifact@v8
        with:
          pattern: machine-evidence-*
          path: target/machine-e2e/host-evidence
          merge-multiple: true
      - name: Reject missing, failed, or stale host evidence
        run: >-
          python tools/verify_machine_profile.py
          --repository .
          --require-host-evidence target/machine-e2e/host-evidence
          --required-host macos
          --required-host linux
